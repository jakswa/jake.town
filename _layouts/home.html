<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📞</text></svg>">
  <title>{{ page.title | default: site.title }}</title>

  <link rel="preload" href="/assets/fonts/jetbrains-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face { font-family: 'JetBrains Mono'; font-style: normal; font-weight: 400 600; font-display: swap;
      src: url('/assets/fonts/jetbrains-mono-latin.woff2') format('woff2'); }
    @font-face { font-family: 'Newsreader'; font-style: normal; font-weight: 300 500; font-display: swap;
      src: url('/assets/fonts/newsreader-latin.woff2') format('woff2'); }
    @font-face { font-family: 'Newsreader'; font-style: italic; font-weight: 400; font-display: swap;
      src: url('/assets/fonts/newsreader-italic-latin.woff2') format('woff2'); }
  </style>

  <!-- Open Graph / Social -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:site_name" content="Jake Swanson">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{ page.title | default: site.title }}">
  <meta name="twitter:description" content="{{ page.description | default: site.description }}">

  <style>
    :root {
      --bg: #0f0d09;
      --bg-soft: #1a1610;
      --bg-line: #262017;
      --paper: #f5f1e8;
      --paper-warm: #cfc6b3;
      --ink-mute: #7a705f;
      --glow: #f0a64a;
      --signal: #c2410c;
      --green: #4ade80;
      --serif: "Newsreader", "Source Serif 4", Georgia, serif;
      --sans: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
      --mono: "JetBrains Mono", "Berkeley Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--paper);
      font-family: var(--mono);
      overflow: hidden;
      position: relative;
    }
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 100;
      opacity: 0.18;
      background-image: repeating-linear-gradient(to bottom,
        transparent 0 2px, rgba(255,255,255,.08) 2px 3px);
    }
    body::after {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 99;
      background: radial-gradient(110% 80% at 50% 50%, transparent 50%, rgba(0,0,0,.55) 100%);
    }
    a { color: inherit; text-decoration: none; }
  </style>
</head>
<body>
  {{ content }}
</body>
</html>
