<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📞</text></svg>">
  <title>{% if page.title %}{{ page.title }} - {% endif %}Jake Swanson</title>
  <style>
    :root {
      --text: #111;
      --text-secondary: #444;
      --accent: #b45309;
      --border: #ddd;
      --bg: #fff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --text: #e5e5e5;
        --text-secondary: #a3a3a3;
        --accent: #fbbf24;
        --border: #404040;
        --bg: #171717;
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      line-height: 1.6;
      color: var(--text);
      background: var(--bg);
      max-width: 850px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    a {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    a:hover {
      text-decoration-thickness: 2px;
    }

    nav {
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.95rem;
    }

    nav a {
      margin-right: 1.5rem;
    }

    @media print {
      nav { display: none; }
    }
  </style>
  {% if page.extra_css %}{{ page.extra_css }}{% endif %}
</head>
<body>
  <nav>
    <a href="/">Home</a>
    <a href="/resume">Resume</a>
    <a href="/blog/">Blog</a>
  </nav>
  {{ content }}
</body>
</html>
