---
layout: default
---
<style>
  article .hero-image {
    width: calc(100% + 3rem);
    margin: 0 -1.5rem 2rem -1.5rem;
    max-width: none;
    border-radius: 0;
  }

  article h1 {
    font-size: 1.75rem;
    margin-bottom: 0.5rem;
  }

  article .meta {
    color: var(--text-secondary);
    font-size: 0.9rem;
    margin-bottom: 2rem;
  }

  article h2 {
    font-size: 1.25rem;
    margin-top: 2rem;
    margin-bottom: 0.75rem;
  }

  article h3 {
    font-size: 1.1rem;
    margin-top: 1.5rem;
    margin-bottom: 0.5rem;
  }

  article p {
    margin-bottom: 1rem;
    color: var(--text-secondary);
  }

  article ul, article ol {
    margin-left: 1.25rem;
    margin-bottom: 1rem;
    color: var(--text-secondary);
  }

  article li {
    margin-bottom: 0.35rem;
  }

  article code {
    background: var(--border);
    padding: 0.2rem 0.4rem;
    border-radius: 3px;
    font-size: 0.95em;
  }

  article pre {
    background: var(--border);
    padding: 1rem;
    border-radius: 4px;
    overflow-x: auto;
    margin-bottom: 1rem;
    font-size: 0.95rem;
    line-height: 1.5;
  }

  article pre code {
    background: none;
    padding: 0;
    font-size: inherit;
  }

  article blockquote {
    border-left: 3px solid var(--accent);
    padding-left: 1rem;
    margin: 1rem 0;
    color: var(--text-secondary);
    font-style: italic;
  }

  article img {
    max-width: 100%;
    height: auto;
    border-radius: 4px;
    margin: 1rem 0;
  }

  article .float-left {
    float: left;
    max-width: 300px;
    margin: 0 1.5rem 1rem 0;
  }

  article figure.float-left img {
    margin: 0;
  }

  article figure {
    margin: 1.5rem 0;
  }

  article figure img {
    margin: 0;
  }

  article figcaption {
    font-size: 0.85rem;
    color: var(--text-secondary);
    font-style: italic;
    margin-top: 0.5rem;
  }

  article .image-pair {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
  }

  article .image-pair img {
    margin: 0;
  }

  article .image-pair figcaption {
    grid-column: 1 / -1;
  }

  article table {
    border-collapse: collapse;
    margin: 1rem 0;
    font-size: 0.9rem;
  }

  article th, article td {
    border: 1px solid var(--border);
    padding: 0.5rem 0.75rem;
    text-align: left;
  }

  article th {
    background: var(--border);
  }

  @media (max-width: 600px) {
    article .float-left {
      float: none;
      max-width: 100%;
      margin: 1rem 0;
    }

    article .image-pair {
      grid-template-columns: 1fr;
    }
  }
</style>

<article>
  <h1>{{ page.title }}</h1>
  <p class="meta">{{ page.date | date: "%B %d, %Y" }}</p>
  {{ content }}
</article>

<script src="https://giscus.app/client.js"
        data-repo="jakswa/jake.town"
        data-repo-id="R_kgDOQzmm9A"
        data-category="General"
        data-category-id="DIC_kwDOQzmm9M4C0kwg"
        data-mapping="pathname"
        data-strict="0"
        data-reactions-enabled="1"
        data-emit-metadata="0"
        data-input-position="top"
        data-theme="gruvbox"
        data-lang="en"
        data-loading="lazy"
        crossorigin="anonymous"
        async>
</script>
