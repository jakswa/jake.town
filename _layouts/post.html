---
layout: default
---
<article class="post prose">
  <p class="meta">{{ page.date | date: "%Y-%m-%d" }} · {{ content | number_of_words | divided_by: 200 }} min read</p>
  <h1 class="post-title">{{ page.title }}</h1>
  {% if page.description %}<p class="lede">{{ page.description }}</p>{% endif %}
  {{ content }}
</article>
<p class="back"><a href="/blog/">&larr; all posts</a></p>
<div class="comments">
  <div class="c-label">Comments</div>
  <script src="https://giscus.app/client.js"
          data-repo="jakswa/jake.town"
          data-repo-id="R_kgDOQzmm9A"
          data-category="General"
          data-category-id="DIC_kwDOQzmm9M4C0kwg"
          data-mapping="pathname"
          data-strict="0"
          data-reactions-enabled="1"
          data-emit-metadata="0"
          data-input-position="top"
          data-theme="light"
          data-lang="en"
          data-loading="lazy"
          crossorigin="anonymous"
          async></script>
</div>
