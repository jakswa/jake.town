<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📞</text></svg>">
  <title>{% if page.title %}{{ page.title }} — {% endif %}Jake Swanson</title>

  <link rel="preload" href="/assets/fonts/jetbrains-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face { font-family: 'JetBrains Mono'; font-style: normal; font-weight: 400 600; font-display: swap;
      src: url('/assets/fonts/jetbrains-mono-latin.woff2') format('woff2'); }
    @font-face { font-family: 'Newsreader'; font-style: normal; font-weight: 400 500; font-display: swap;
      src: url('/assets/fonts/newsreader-latin.woff2') format('woff2'); }
    @font-face { font-family: 'Newsreader'; font-style: italic; font-weight: 400; font-display: swap;
      src: url('/assets/fonts/newsreader-italic-latin.woff2') format('woff2'); }
  </style>

  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ page.title | default: 'Resume' }} — Jake Swanson">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">

  <style>
    :root {
      --bg: #0f0d09;
      --bg-soft: #1a1610;
      --bg-line: #262017;
      --paper: #f5f1e8;
      --paper-warm: #cfc6b3;
      --ink-mute: #7a705f;
      --glow: #f0a64a;
      --signal: #c2410c;
      --green: #4ade80;
      --syntax-key: #a5e3ff;
      --syntax-str: #c8f0a5;
      --serif: "Newsreader", "Source Serif 4", Georgia, serif;
      --mono: "JetBrains Mono", "Berkeley Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bg); }
    body {
      color: var(--paper-warm); font-family: var(--mono);
      font-size: 13px; line-height: 1.55;
      max-width: 960px; margin: 0 auto; padding: 36px 44px 60px;
      position: relative;
    }
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 100;
      opacity: 0.07;
      background-image: repeating-linear-gradient(to bottom,
        transparent 0 2px, rgba(255,255,255,.15) 2px 3px);
    }
    a { color: var(--glow); text-decoration: none; }
    a:hover { text-decoration: underline; text-underline-offset: 3px; }

    .winbar { display: flex; align-items: center; gap: 8px; margin-bottom: 24px;
              padding-bottom: 12px; border-bottom: 1px solid var(--bg-line); }
    .winbar .dot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }
    .winbar .r { background: #ff5f57; }
    .winbar .y { background: #febc2e; }
    .winbar .g { background: #28c840; }
    .winbar .title { margin-left: 14px; font-size: 11px; letter-spacing: 0.18em; color: var(--ink-mute); }
    .winbar .title a { color: var(--green); text-decoration: none; }
    .winbar .title a:hover { color: var(--glow); text-decoration: underline; }
    .winbar .title .here { color: var(--paper); }
    .winbar .when { margin-left: auto; font-size: 11px; color: var(--ink-mute); }

    .prompt { color: var(--green); }
    .arg { color: var(--glow); }
    .syntax-key { color: var(--syntax-key); }
    .syntax-str { color: var(--syntax-str); }
    .syntax-str::before, .syntax-str::after { content: '"'; }

    .ident { border: 1px solid var(--bg-line); padding: 20px; border-radius: 3px;
             background: var(--bg-soft); margin: 18px 0 28px;
             display: grid; grid-template-columns: 1fr auto; gap: 24px; }
    .ident .lab { font-size: 10px; letter-spacing: 0.24em; color: var(--glow); margin-bottom: 10px; }
    .ident h1 { font-family: var(--serif); font-weight: 400; font-size: 44px; line-height: 0.95;
                margin-bottom: 6px; letter-spacing: -0.02em; color: var(--paper); }
    .ident h1 em { font-style: normal; color: var(--glow); }
    .ident .tag { color: var(--paper-warm); font-size: 13px; margin-bottom: 14px; }
    .ident .grid { display: grid; grid-template-columns: 90px 1fr; gap: 4px 16px; font-size: 12px; }
    .ident .grid .k { color: var(--ink-mute); }
    .ident aside { text-align: right; font-size: 11px; color: var(--ink-mute); line-height: 1.9; }
    .ident aside .live { color: var(--green); margin-bottom: 2px; }

    .section-line { display: flex; align-items: center; gap: 14px; margin: 22px 0 14px; }
    .section-line .lab { font-size: 11px; letter-spacing: 0.28em; color: var(--glow); text-transform: uppercase; }
    .section-line .rule { flex: 1; height: 1px; background: var(--bg-line); }

    .session { border: 1px solid var(--bg-line); border-left: 2px solid var(--bg-line);
               padding: 16px 20px; border-radius: 3px; background: var(--bg-soft); margin-bottom: 14px; }
    .session.live { border-left-color: var(--green); }
    .session-hdr { display: flex; justify-content: space-between; align-items: center;
                   margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }
    .session-hdr .left { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    .session-hdr .sid { color: var(--glow); font-size: 11px; letter-spacing: 0.18em; }
    .session-hdr .pip { font-size: 9px; letter-spacing: 0.22em; padding: 1px 7px;
                       border: 1px solid currentColor; border-radius: 2px; }
    .session-hdr .pip.live { color: var(--green); }
    .session-hdr .pip.dis { color: var(--ink-mute); }
    .session-hdr .when { font-size: 11px; color: var(--ink-mute); }
    .session .role { margin-bottom: 4px; }
    .session .role .t { color: var(--paper); font-size: 16px; font-weight: 500; }
    .session .role .at { color: var(--ink-mute); margin: 0 8px; }
    .session .role .co { color: var(--glow); }
    .session .role .loc { color: var(--ink-mute); font-size: 11px; margin-left: 10px; }
    .session .stack { font-size: 12px; color: var(--ink-mute); margin-bottom: 10px; }
    .session ul { list-style: none; }
    .session li { display: flex; gap: 10px; color: var(--paper-warm);
                  font-size: 13px; line-height: 1.55; margin-bottom: 4px; }
    .session li::before { content: "→"; color: var(--glow); }

    .stacks-obj { border: 1px solid var(--bg-line); padding: 14px 18px; border-radius: 3px;
                  background: var(--bg-soft); margin-bottom: 28px; }
    .stacks-obj .indent { padding-left: 16px; }

    .proj { border-left: 2px solid var(--glow); padding-left: 14px; margin-bottom: 16px; }
    .proj .name { color: var(--glow); font-weight: 500; }
    .proj .url { color: var(--ink-mute); margin-left: 10px; font-size: 11px; }
    .proj .desc { color: var(--paper-warm); font-size: 13px; }

    .writing { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 24px; margin-bottom: 28px; }
    .writing a { color: var(--paper-warm); font-size: 13px; }
    .writing a:hover { color: var(--glow); }
    .writing a .sh { color: var(--ink-mute); }
    .writing a .cmd { color: var(--glow); }

    .edu div { color: var(--paper-warm); }

    .close { margin-top: 28px; }
    .close .closed { color: var(--green); }
    .close .have { color: var(--ink-mute); }

    .colophon { margin-top: 28px; padding-top: 14px; border-top: 1px dashed var(--bg-line);
                font-size: 10px; letter-spacing: 0.2em; color: var(--ink-mute);
                display: flex; justify-content: space-between; }

    /* Print: A4-ready B&W */
    @media print {
      body { background: #fff; color: #111; max-width: none; padding: 0.4in 0.6in; font-size: 10pt; }
      body::before { display: none; }
      .winbar, .colophon, .close { display: none; }
      a { color: #111; text-decoration: underline; }
      .ident { background: #fafafa; border-color: #aaa; }
      .ident h1, .ident h1 em { color: #111; }
      .ident .lab, .session-hdr .sid, .section-line .lab,
      .stacks-obj .syntax-key, .proj .name, .session .role .co { color: #b45309 !important; }
      .ident .grid .k, .ident aside, .session-hdr .when, .session .stack,
      .session .role .loc, .ident .tag, .session li, .proj .desc,
      .writing a, .edu div, .ident .grid { color: #333 !important; }
      .stacks-obj .syntax-str { color: #333 !important; }
      .stacks-obj .syntax-str::before, .stacks-obj .syntax-str::after { display: none; }
      .session { background: #fafafa; border-color: #ccc; page-break-inside: avoid; }
      .stacks-obj { background: #fafafa; border-color: #ccc; }
      .prompt { display: none; }
    }

    @media (max-width: 640px) {
      body { padding: 24px 16px 36px; font-size: 12px; }
      .ident { grid-template-columns: 1fr; }
      .ident aside { text-align: left; }
      .writing { grid-template-columns: 1fr; }
      .ident h1 { font-size: 36px; }
    }
  </style>
</head>
<body>
  <div class="winbar" role="presentation">
    <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
    <span class="title">jakswa@callrail <a href="/">~</a> / <span class="here">resume</span> ─ zellij 0</span>
    <span class="when" id="winbar-when"></span>
  </div>

  {{ content }}

  <div class="colophon">
    <span>jake.town/resume · v.2026</span>
    <span>set in JetBrains Mono + Newsreader</span>
  </div>

  <script>
    const wbWhen = document.getElementById('winbar-when');
    function tick() {
      const d = new Date();
      wbWhen.textContent = d.toLocaleDateString() + ' · ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    tick(); setInterval(tick, 30000);
  </script>
</body>
</html>
