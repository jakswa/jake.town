<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📞</text></svg>">
  <title>Resume - Jake Swanson</title>

  <!-- Open Graph / Social -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Resume - Jake Swanson">
  <meta property="og:description" content="Staff engineer. Backend systems, some frontend, lots of phone calls.">
  <meta property="og:url" content="{{ site.url }}/resume">
  <meta property="og:site_name" content="Jake Swanson">

  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Resume - Jake Swanson">
  <meta name="twitter:description" content="Staff engineer. Backend systems, some frontend, lots of phone calls.">

  <style>
    :root {
      --text: #111;
      --text-secondary: #444;
      --accent: #b45309;
      --border: #ddd;
      --bg: #fff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --text: #e5e5e5;
        --text-secondary: #a3a3a3;
        --accent: #fbbf24;
        --border: #404040;
        --bg: #171717;
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      line-height: 1.6;
      color: var(--text);
      background: var(--bg);
      max-width: 850px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    a {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    a:hover {
      text-decoration-thickness: 2px;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
    }

    header {
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 2px solid var(--border);
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    header .tagline {
      font-size: 1.1rem;
      color: var(--text-secondary);
      margin-bottom: 1rem;
    }

    .contact-info {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1.5rem;
      font-size: 0.9rem;
    }

    .contact-info span {
      white-space: nowrap;
    }

    section {
      margin-bottom: 2rem;
    }

    section h2 {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent);
      margin-bottom: 1rem;
      padding-bottom: 0.25rem;
      border-bottom: 1px solid var(--border);
    }

    .job {
      margin-bottom: 1.5rem;
    }

    .job:last-child {
      margin-bottom: 0;
    }

    .job-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 0.25rem 1rem;
      margin-bottom: 0.25rem;
    }

    .job-title {
      font-weight: 600;
      font-size: 1.05rem;
    }

    .job-date {
      font-size: 0.9rem;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .job-company {
      color: var(--text-secondary);
      font-size: 0.95rem;
      margin-bottom: 0.5rem;
    }

    .job ul {
      margin-left: 1.25rem;
      color: var(--text-secondary);
    }

    .job li {
      margin-bottom: 0.35rem;
    }

    .tech-stack {
      font-size: 0.85rem;
      color: var(--text-secondary);
      font-style: italic;
      margin-bottom: 0.5rem;
    }

    .skills-inline {
      color: var(--text-secondary);
      font-size: 0.95rem;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .skills-inline strong {
      color: var(--text);
      font-weight: 600;
    }

    .job-minimal {
      margin-bottom: 1rem;
    }

    .project {
      margin-bottom: 1rem;
    }

    .project-name {
      font-weight: 600;
    }

    .project-desc {
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    .links-list {
      list-style: none;
      color: var(--text-secondary);
    }

    .links-list li {
      margin-bottom: 0.35rem;
    }

    .education-entry {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.25rem 1rem;
    }

    .education-entry .school {
      font-weight: 600;
    }

    .education-entry .degree {
      color: var(--text-secondary);
    }

    .education-entry .years {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    /* Print styles */
    @media print {
      body {
        padding: 0;
        font-size: 11pt;
        max-width: none;
      }

      a {
        color: var(--text);
      }

      .back-link {
        display: none;
      }

      header {
        padding-bottom: 1rem;
        margin-bottom: 1.5rem;
      }

      section {
        margin-bottom: 1.25rem;
      }

      .job {
        margin-bottom: 1rem;
        page-break-inside: avoid;
      }

      section h2 {
        margin-bottom: 0.75rem;
      }
    }

    @media (max-width: 500px) {
      .job-header {
        flex-direction: column;
      }

      .contact-info {
        flex-direction: column;
        gap: 0.25rem;
      }
    }
  </style>
</head>
<body>
  <a href="/" class="back-link">&larr; jake.town</a>
  {{ content }}
</body>
</html>
