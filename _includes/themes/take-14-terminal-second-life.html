<style>
    :root {
      --disp: 'IBM Plex Mono', monospace;
      --body: 'Spline Sans Mono', 'IBM Plex Mono', monospace;
      --meta: 'IBM Plex Mono', monospace;
      --mono: 'IBM Plex Mono', monospace;
      --bg: #f6f4ee;
      --ink: #201d18;
      --ink-soft: #413d35;
      --muted: #6a655a;
      --faint: #9b9484;
      --line: #e0dccf;
      --accent: #2f6f4f;
      --td: #c7c1b1;
      --code-bg: #ece8dd;
      --pre-bg: #efece3;
      --pre-fg: #2a2721;
      --fs: 16.5px;
      --lh: 1.7;
      --maxw: 700px;
      --pad: 32px;
      --head-pad: 44px;
      --main-pad: 48px;
      --foot-mt: 72px;
      --brand-w: 400;
      --brand-s: 16px;
      --brand-ls: 0;
      --meta-s: 12px;
      --meta-ls: .06em;
      --home-name-w: 400;
      --home-name-s: 44px;
      --home-name-ls: 0;
      --home-tag-s: 18px;
      --home-link-w: 400;
      --home-link-s: 20px;
      --home-link-pad: 15px;
      --home-link-border: 1px solid var(--line);
      --index-title-w: 400;
      --index-title-s: 30px;
      --index-title-ls: 0;
      --rss-ls: .1em;
      --post-gap: 36px;
      --date-s: 12px;
      --date-ls: .06em;
      --post-t-w: 400;
      --post-t-s: 20px;
      --post-title-w: 400;
      --post-title-s: 34px;
      --post-title-ls: 0;
      --lede-s: 19px;
      --p-gap: 18px;
      --h2-mt: 44px;
      --h2-w: 400;
      --h2-s: 17px;
      --h2-ls: .14em;
      --h3-w: 400;
      --h3-s: 17px;
      --code-r: 3px;
      --pre-r: 5px;
      --img-r: 3px;
      --pre-border: 1px solid var(--line);
      --r-name-w: 400;
      --r-name-s: 38px;
      --r-name-ls: 0;
      --r-tag-s: 18px;
      --contact-s: 12.5px;
      --sec-mt: 52px;
      --sec-label-s: 11px;
      --sec-label-ls: .2em;
      --sec-rule: 1px solid var(--line);
      --job-w: 400;
      --job-s: 18px;
      --stack-s: 12.5px;
      --proj-w: 400;
      --proj-s: 17px;
      --label-tt: none;
      --label-ls: .2em;
    }
    @font-face { font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 400; font-display: swap; src: url('/assets/fonts/ibm-plex-mono-latin-400-normal.woff2') format('woff2'); }
    @font-face { font-family: 'Spline Sans'; font-style: normal; font-weight: 400; font-display: swap; src: url('/assets/fonts/spline-sans-latin-400-normal.woff2') format('woff2'); }
    @font-face { font-family: 'Spline Sans'; font-style: normal; font-weight: 500; font-display: swap; src: url('/assets/fonts/spline-sans-latin-500-normal.woff2') format('woff2'); }
    @font-face { font-family: 'Spline Sans Mono'; font-style: normal; font-weight: 400; font-display: swap; src: url('/assets/fonts/spline-sans-mono-latin-400-normal.woff2') format('woff2'); }
    @font-face { font-family: 'Spline Sans Mono'; font-style: normal; font-weight: 500; font-display: swap; src: url('/assets/fonts/spline-sans-mono-latin-500-normal.woff2') format('woff2'); }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: var(--bg); }
    body {
      background: var(--bg); color: var(--ink);
      font-family: var(--body); font-size: var(--fs); line-height: var(--lh);
      -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    }
    a { color: var(--ink); text-decoration: underline; text-decoration-color: var(--td); text-underline-offset: 3px; }
    a:hover { color: var(--accent); text-decoration-color: var(--accent); }
    .shell { max-width: var(--maxw); margin: 0 auto; padding: 0 var(--pad); }
    .site-head { padding: var(--head-pad) 0 0; display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; }
    .brand { font-family: var(--disp); font-weight: var(--brand-w); font-size: var(--brand-s); letter-spacing: var(--brand-ls); color: var(--ink); text-decoration: none; }
    .nav { font-family: var(--meta); font-size: var(--meta-s); letter-spacing: var(--meta-ls); display: flex; gap: 18px; }
    .nav a { color: var(--muted); text-decoration: none; }
    .nav a:hover { color: var(--ink); text-decoration: underline; }
    main { padding: var(--main-pad) 0 12px; }
    .site-foot { border-top: 1px solid var(--line); margin-top: var(--foot-mt); padding: 18px 0 40px;
                 display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
                 font-family: var(--meta); font-size: var(--meta-s); color: var(--faint); }
    .colophon { font-style: normal; }


    .prose p { margin-bottom: var(--p-gap); }
    .prose h2 { font-family: var(--disp); font-weight: var(--h2-w); font-size: var(--h2-s); line-height: 1.22; letter-spacing: var(--h2-ls); margin: var(--h2-mt) 0 12px; }
    .prose h3 { font-family: var(--disp); font-weight: var(--h3-w); font-size: var(--h3-s); margin: 28px 0 9px; }
    .prose ul, .prose ol { margin: 0 0 var(--p-gap) 1.3em; }
    .prose li { margin-bottom: 5px; }
    .prose li::marker { color: var(--faint); }
    .prose code { font-family: var(--mono); font-size: .85em; background: var(--code-bg); padding: 1px 6px; border-radius: var(--code-r); }
    .prose pre { margin: 22px 0; padding: 16px 18px; background: var(--pre-bg); border: var(--pre-border); border-radius: var(--pre-r); overflow-x: auto; }
    .prose pre code { background: none; padding: 0; font-size: 13px; line-height: 1.65; color: var(--pre-fg); }
    .prose blockquote { margin: 22px 0; padding-left: 16px; border-left: 2px solid var(--line); font-style: italic; color: var(--ink-soft); }
    .prose blockquote p { margin-bottom: 0; }
    .prose figure { margin: 24px 0; }
    .prose img, .prose figure img { max-width: 100%; height: auto; }
    .prose img.hero-image, .prose figure.hero-image img { border-radius: var(--img-r); }
    .prose figure.hero-image { margin: 0 0 24px; }
    .prose figcaption { font-family: var(--meta); font-size: var(--meta-s); color: var(--faint); margin-top: 7px; }
    .prose .float-left { float: left; max-width: 300px; margin: 4px 24px 12px 0; }
    .prose table { border-collapse: collapse; margin: 22px 0; width: 100%; font-size: calc(var(--fs) - 2px); line-height: 1.55; }
    .prose th, .prose td { border: 1px solid var(--line); padding: 6px 11px; text-align: left; vertical-align: top; }
    .prose th { font-family: var(--meta); font-weight: 400; font-size: var(--meta-s); letter-spacing: .04em; color: var(--muted); }


    .home { padding-top: 28px; }
    .home-name { font-family: var(--disp); font-weight: var(--home-name-w); font-size: var(--home-name-s); line-height: 1.04; letter-spacing: var(--home-name-ls); margin-bottom: 14px; }
    .home-tag { font-size: var(--home-tag-s); line-height: 1.5; color: var(--ink-soft); max-width: 32em; margin-bottom: 44px; }
    .home-links { list-style: none; }
    .home-links li { border-top: var(--home-link-border); }
    .home-links a { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; padding: var(--home-link-pad) 0;
                    font-family: var(--disp); font-weight: var(--home-link-w); font-size: var(--home-link-s); letter-spacing: -0.01em; text-decoration: none; color: var(--ink); }
    .home-links a span { font-family: var(--body); font-size: calc(var(--fs) - 1px); color: var(--faint); }
    .home-links a:hover { color: var(--accent); }


    .index-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 34px; }
    .index-title { font-family: var(--disp); font-weight: var(--index-title-w); font-size: var(--index-title-s); letter-spacing: var(--index-title-ls); }
    .rss { font-family: var(--meta); font-size: var(--meta-s); letter-spacing: var(--rss-ls); color: var(--faint); text-decoration: none; }
    .rss:hover { color: var(--accent); text-decoration: underline; }
    .posts { list-style: none; }
    .posts > li { margin-bottom: var(--post-gap); }
    .posts > li > a { display: block; text-decoration: none; }
    .posts .date { display: block; font-family: var(--meta); font-size: var(--date-s); letter-spacing: var(--date-ls); color: var(--faint); margin-bottom: 6px; }
    .posts .t { display: block; font-family: var(--disp); font-weight: var(--post-t-w); font-size: var(--post-t-s); line-height: 1.24; letter-spacing: -0.01em; margin-bottom: 5px; }
    .posts > li > a:hover .t { color: var(--accent); }
    .posts .d { display: block; font-size: calc(var(--fs) - 1px); line-height: 1.55; color: var(--muted); max-width: 30em; }


    .meta { font-family: var(--meta); font-size: var(--meta-s); letter-spacing: var(--meta-ls); color: var(--faint); margin-bottom: 15px; }
    .post-title { font-family: var(--disp); font-weight: var(--post-title-w); font-size: var(--post-title-s); line-height: 1.1; letter-spacing: var(--post-title-ls); margin-bottom: 13px; }
    .lede { font-style: italic; font-size: var(--lede-s); line-height: 1.55; color: var(--ink-soft); margin-bottom: 30px; }
    .back { margin-top: 42px; }
    .back a { font-family: var(--meta); font-size: var(--meta-s); color: var(--muted); text-decoration: none; }
    .back a:hover { color: var(--accent); }
    .comments { margin-top: 42px; padding-top: 24px; border-top: 1px solid var(--line); }
    .c-label { font-family: var(--meta); font-size: var(--meta-s); letter-spacing: var(--label-ls); text-transform: var(--label-tt); color: var(--faint); margin-bottom: 15px; }


    .r-head { padding-top: 6px; }
    .r-name { font-family: var(--disp); font-weight: var(--r-name-w); font-size: var(--r-name-s); line-height: 1.07; letter-spacing: var(--r-name-ls); margin-bottom: 11px; }
    .r-tag { font-size: var(--r-tag-s); line-height: 1.55; color: var(--ink-soft); max-width: 36em; margin-bottom: 18px; }
    .r-contact { font-family: var(--meta); font-size: var(--contact-s); line-height: 2.1; color: var(--muted); }
    .r-contact a { color: var(--muted); text-decoration: none; }
    .r-contact a:hover { color: var(--accent); text-decoration: underline; }
    .r-sec { margin-top: var(--sec-mt); }
    .r-sec > h2 { font-family: var(--meta); font-weight: 400; font-size: var(--sec-label-s); letter-spacing: var(--sec-label-ls);
                  text-transform: var(--label-tt); color: var(--faint); padding-bottom: 8px; border-bottom: var(--sec-rule); margin-bottom: 20px; }
    .job { margin-bottom: 30px; }
    .job:last-child { margin-bottom: 0; }
    .job-line { display: flex; justify-content: space-between; align-items: baseline; gap: 4px 16px; flex-wrap: wrap; }
    .job-line h3 { font-family: var(--disp); font-weight: var(--job-w); font-size: var(--job-s); letter-spacing: -0.01em; line-height: 1.3; }
    .job-line .when { font-family: var(--meta); font-size: var(--meta-s); letter-spacing: .04em; color: var(--faint); white-space: nowrap; }
    .job .stack { font-family: var(--mono); font-size: var(--stack-s); line-height: 1.7; color: var(--muted); margin: 6px 0 10px; }
    .job ul { margin: 0 0 0 1.3em; }
    .job li { font-size: calc(var(--fs) - 1px); line-height: 1.65; margin-bottom: 7px; }
    .stacks { display: grid; grid-template-columns: auto 1fr; column-gap: 24px; row-gap: 10px; }
    .stacks dt { font-family: var(--meta); font-size: var(--stack-s); color: var(--muted); padding-top: 3px; }
    .stacks dd { font-size: calc(var(--fs) - 1px); line-height: 1.6; }
    .proj { margin-bottom: 22px; }
    .proj:last-child { margin-bottom: 0; }
    .proj .name { font-family: var(--disp); font-weight: var(--proj-w); font-size: var(--proj-s); letter-spacing: -0.005em; text-decoration: none; }
    .proj .name:hover { color: var(--accent); text-decoration: underline; }
    .proj p { font-size: calc(var(--fs) - 1px); line-height: 1.6; color: var(--muted); margin-top: 4px; max-width: 32em; }
    .r-posts { list-style: none; }
    .r-posts li { font-size: calc(var(--fs) - 1px); margin-bottom: 9px; }
    .edu { font-size: calc(var(--fs) - 1px); }


    @media (max-width: 640px) {
      .shell { padding: 0 20px; }
      body { font-size: calc(var(--fs) - 1px); }
      .home-name { font-size: calc(var(--home-name-s) * .78); }
      .post-title { font-size: calc(var(--post-title-s) * .8); }
      .index-title, .r-name { font-size: calc(var(--index-title-s) * .82); }
      .prose .float-left { float: none; max-width: 100%; margin: 14px 0; }
    }
    @media (max-width: 480px) {
      .stacks { grid-template-columns: 1fr; row-gap: 3px; }
      .stacks dt { margin-top: 9px; }
      .job-line .when { white-space: normal; }
    }


    @media print {
      :root, [data-scheme] { --bg:#fff; --ink:#000; --ink-soft:#222; --muted:#444; --faint:#666; --line:#ccc; --accent:#000; }
      body { font-size: 11pt; line-height: 1.55; }
      .site-head, .site-foot, .back, .comments { display: none !important; }
      main { padding: 0; }
      .shell { max-width: none; padding: .5in .6in; }
      a { color: #000; text-decoration: none; }
    }
</style>
